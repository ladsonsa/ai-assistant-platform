# ==========================================
# AI Assistant Services Orchestration
# ==========================================
services:

  # Backend Service (Python / FastAPI)
  backend:
    build:
      context: ./
      dockerfile: Dockerfile
    container_name: ai_assistant_backend
    ports:
      - "8000:8000"
    env_file:
      - ./.env
    environment:
      - PORT=8000
    restart: unless-stopped

  # Frontend Service (Next.js / TypeScript)
  frontend:
    build:
      context: ../ai-assistant-frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
    container_name: ai_assistant_frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    depends_on:
      - backend
    restart: unless-stopped