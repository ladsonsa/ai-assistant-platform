[project]
name = "ai-assistant-platform"
version = "0.1.0"
description = "An AI-powered chatbot that processes and solves basic mathematical operations (addition, subtraction, multiplication, division) and simple equations in multiple languages."
authors = [
    {name = "Ládson Sá",email = "123712890+PreGUU@users.noreply.github.com"}
]
license = "MIT"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "streamlit (>=1.59.2,<2.0.0)",
    "openai (>=2.46.0,<3.0.0)",
    "google-genai (>=2.12.1,<3.0.0)",
    "dotenv (>=0.9.9,<0.10.0)",
    "fastapi (>=0.141.1,<0.142.0)",
    "uvicorn[standard] (>=0.52.0,<0.53.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "ruff (>=0.15.22,<0.16.0)",
    "black (>=26.5.1,<27.0.0)",
    "pytest-cov (>=7.1.0,<8.0.0)"
]

[tool.black]
target-version = ['py314']

[tool.pytest.ini_options]
addopts = "--cov=. --cov-report=term-missing"
testpaths = ["tests"]